    <script>
    // File picker enhancer — adds real PDF/DOCX/TXT upload to the document textarea
    (function () {
      var PLACEHOLDERS = ['Paste document text here for real analysis', 'الصق نص المستند هنا'];
      function isUploadTextarea(ta) {
        return PLACEHOLDERS.some(function (p) { return (ta.placeholder || '').indexOf(p) !== -1; });
      }
      function getAuthToken() {
        // Try all known sessionStorage keys the React bundle might use
        var ssKeys = ['mashrooth_auth_v1', 'mashrooth_token', 'mashrooth_user', 'ma', 'Ts'];
        for (var i = 0; i < ssKeys.length; i++) {
          try {
            var raw = sessionStorage.getItem(ssKeys[i]);
            if (!raw) continue;
            var p = JSON.parse(raw);
            if (p && typeof p.token === 'string' && p.token.length > 20) return p.token;
            if (p && typeof p.access_token === 'string' && p.access_token.length > 20) return p.access_token;
          } catch(e) {
            try {
              var s = sessionStorage.getItem(ssKeys[i]);
              if (s && s.length > 30 && s.indexOf('{') !== 0) return s;
            } catch(e2) {}
          }
        }
        // Fallback: Supabase stores its own session in localStorage as sb-<ref>-auth-token
        try {
          for (var k in localStorage) {
            if (k.indexOf('sb-') === 0 && k.indexOf('auth-token') !== -1) {
              var sb = JSON.parse(localStorage.getItem(k) || '{}');
              if (sb && sb.access_token) return sb.access_token;
            }
          }
        } catch(e) {}
        return '';
      }
      function setReactValue(el, value) {
        var proto = el.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
        var setter = Object.getOwnPropertyDescriptor(proto, 'value').set;
        setter.call(el, value);
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }
      function attachPicker(ta) {
        if (ta.dataset.pickerAttached) return;
        ta.dataset.pickerAttached = '1';
        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.pdf,.docx,.txt';
        fileInput.style.display = 'none';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '📎 Choose File  (PDF / DOCX / TXT)';
        btn.style.cssText = 'display:block;width:100%;margin-top:4px;padding:6px 10px;background:#0f766e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;text-align:left;';
        btn.onmouseover = function () { btn.style.background = '#0d9488'; };
        btn.onmouseout  = function () { btn.style.background = '#0f766e'; };
        btn.onclick = function () { fileInput.click(); };
        fileInput.onchange = async function () {
          var file = fileInput.files[0];
          if (!file) return;
          btn.textContent = '⏳ Reading ' + file.name + '…';
          btn.disabled = true;
          try {
            var text = '';
            if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
              text = await file.text();
            } else {
              var b64 = await new Promise(function (resolve) {
                var fr = new FileReader();
                fr.onload = function (e) { resolve(e.target.result.split(',')[1]); };
                fr.readAsDataURL(file);
              });
              var resp = await fetch('/api/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getAuthToken() },
                body: JSON.stringify({ content: b64, name: file.name, type: file.type })
              });
              var json = await resp.json();
              if (!resp.ok) throw new Error(json.error || 'Parse failed');
              text = json.text || '';
            }
            setReactValue(ta, text);
            btn.textContent = '✅ ' + file.name + ' (' + text.length + ' chars)';
            setTimeout(function () {
              btn.textContent = '📎 Choose File  (PDF / DOCX / TXT)';
              btn.disabled = false;
              fileInput.value = '';
            }, 3000);
          } catch (err) {
            btn.textContent = '❌ ' + err.message;
            setTimeout(function () {
              btn.textContent = '📎 Choose File  (PDF / DOCX / TXT)';
              btn.disabled = false;
              fileInput.value = '';
            }, 4000);
          }
        };
        ta.parentNode.appendChild(fileInput);
        ta.parentNode.appendChild(btn);
      }
      var observer = new MutationObserver(function () {
        document.querySelectorAll('textarea').forEach(function (ta) {
          if (isUploadTextarea(ta)) attachPicker(ta);
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
    </script>
