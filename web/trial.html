<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mashrooth · Start trial</title><link rel="stylesheet" href="/styles.css"><script src="/trial.js" type="module"></script></head><body><main class="content"><section class="card"><h1>Start your 14-day workspace trial</h1><p>No card required. Confirm your email, then sign in to create your workspace.</p><form id="trial"><div class="field"><label>Workspace name<input name="workspaceName" required minlength="2" maxlength="160" autocomplete="organization"></label></div><div class="field"><label>Work email<input name="email" type="email" required maxlength="254" autocomplete="email"></label></div><div class="field"><label>Password<input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label></div><button class="primary">Create account</button><p id="message" role="status"></p></form><a href="/app">Sign in</a></section></main></body></html>
